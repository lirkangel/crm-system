# Included in every location: add_header is not inherited once a location adds one of its own.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Robots-Tag "noindex" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
